<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Captura en celular</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* One phone on a light ground, the page's black screen framed in black.
     Used only to make the images sent to the client. */
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 30px;
    background: radial-gradient(110% 70% at 50% 35%, #efebe3 0%, #d9d4c8 100%);
    font-family: "JetBrains Mono", monospace;
    color: #0a0a0b;
  }
  h1 { margin: 0; font: 800 46px/0.94 "Archivo", sans-serif; font-variation-settings: "wdth" 70; text-transform: uppercase; text-align: center; }
  h1 em { font-style: normal; color: #1e7a56; }
  .phone {
    padding: 12px;
    border-radius: 52px;
    background: #0a0a0b;
    box-shadow: 0 0 0 1px #c9cbd1, 0 34px 70px rgba(10, 10, 11, 0.35);
  }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 40px; background: #0d2b2f; }
  p { margin: 0; font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6d75; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="phone"><iframe id="screen" title="Pantalla"></iframe></div>
  <p>Propuesta de diseño · Mateo Quadrelli</p>
  <script>
    // ?t= "Plain words *orange words*": the part between asterisks is set in orange.
    const params = new URLSearchParams(location.search);
    const [plain, accent = ""] = (params.get("t") || "").split("*");
    const title = document.getElementById("title");
    title.textContent = plain;
    if (accent) title.append(Object.assign(document.createElement("em"), { textContent: accent }));
    document.getElementById("screen").src = "../index.html?" + (params.get("q") || "captura");
  </script>
</body>
</html>
